<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Illustration of a dark smoke column rising behind a building with no visible flame">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8b9a"/>
      <stop offset="0.6" stop-color="#b3a89c"/>
      <stop offset="1" stop-color="#c9b8a4"/>
    </linearGradient>
    <linearGradient id="sc-smoke" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#3a3a3c" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#55555a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8e8e94" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sc-sky)"/>

  <!-- smoke plume, drifting with the wind -->
  <g fill="url(#sc-smoke)">
    <path d="M430 400 C 404 330, 424 286, 452 246 C 478 208, 468 168, 500 128
             C 528 92, 574 74, 620 62 C 588 96, 566 118, 560 152
             C 596 138, 630 132, 664 136 C 620 160, 592 184, 578 214
             C 606 210, 632 214, 654 226 C 610 240, 578 262, 556 292
             C 534 322, 520 358, 512 400 Z"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="470" cy="230" rx="56" ry="40" fill="#4c4c51"/>
    <ellipse cx="530" cy="160" rx="62" ry="44" fill="#5a5a60"/>
    <ellipse cx="596" cy="112" rx="52" ry="36" fill="#6d6d74"/>
    <ellipse cx="446" cy="308" rx="46" ry="34" fill="#434347"/>
  </g>
  <!-- thinner wisps -->
  <g opacity="0.3" fill="#9a9aa1">
    <ellipse cx="672" cy="84" rx="60" ry="26"/>
    <ellipse cx="716" cy="122" rx="48" ry="20"/>
  </g>

  <!-- foreground structure, occluding the source -->
  <g>
    <rect x="0" y="300" width="330" height="260" fill="#6a5f57"/>
    <rect x="0" y="292" width="330" height="16" fill="#7d7269"/>
    <g fill="#39414b" opacity="0.8">
      <rect x="34" y="330" width="52" height="62" rx="4"/>
      <rect x="110" y="330" width="52" height="62" rx="4"/>
      <rect x="186" y="330" width="52" height="62" rx="4"/>
      <rect x="262" y="330" width="52" height="62" rx="4"/>
      <rect x="34" y="422" width="52" height="62" rx="4"/>
      <rect x="110" y="422" width="52" height="62" rx="4"/>
      <rect x="186" y="422" width="52" height="62" rx="4"/>
    </g>
  </g>
  <g>
    <rect x="640" y="336" width="160" height="224" fill="#5d5c61"/>
    <rect x="640" y="328" width="160" height="14" fill="#6f6e74"/>
    <g fill="#39414b" opacity="0.75">
      <rect x="666" y="360" width="44" height="54" rx="4"/>
      <rect x="730" y="360" width="44" height="54" rx="4"/>
      <rect x="666" y="440" width="44" height="54" rx="4"/>
      <rect x="730" y="440" width="44" height="54" rx="4"/>
    </g>
  </g>

  <!-- roadway between the buildings -->
  <rect x="330" y="440" width="310" height="120" fill="#414750"/>
  <rect x="330" y="432" width="310" height="10" fill="#98a2ac"/>
  <g fill="#d8c65c" opacity="0.7">
    <rect x="470" y="470" width="30" height="8"/>
    <rect x="470" y="506" width="30" height="8"/>
    <rect x="470" y="542" width="30" height="8"/>
  </g>

  <!-- haze wash: the give-away that this is smoke, not cloud -->
  <rect width="800" height="560" fill="#8a7f70" opacity="0.16"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">
    <rect x="18" y="516" width="152" height="28" rx="6" fill="#0b1017" opacity="0.72"/>
    <text x="30" y="535" fill="#c7d0da" letter-spacing="1.4">DEMO SCENE</text>
  </g>
</svg>
