<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Illustration of a large fallen tree lying across both lanes of a road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6b7d"/>
      <stop offset="1" stop-color="#9aa7b4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f56"/>
      <stop offset="1" stop-color="#2b2f34"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a3527"/>
      <stop offset="0.45" stop-color="#6b4c36"/>
      <stop offset="1" stop-color="#3a2a1e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>

  <!-- skyline -->
  <g fill="#3f4954" opacity="0.85">
    <rect x="20" y="120" width="90" height="180"/>
    <rect x="125" y="70" width="70" height="230"/>
    <rect x="210" y="140" width="60" height="160"/>
    <rect x="600" y="95" width="80" height="205"/>
    <rect x="695" y="150" width="85" height="150"/>
  </g>
  <g fill="#8b98a5" opacity="0.5">
    <rect x="36" y="140" width="12" height="16"/><rect x="60" y="140" width="12" height="16"/>
    <rect x="36" y="176" width="12" height="16"/><rect x="60" y="176" width="12" height="16"/>
    <rect x="141" y="96" width="12" height="16"/><rect x="165" y="96" width="12" height="16"/>
    <rect x="141" y="132" width="12" height="16"/><rect x="165" y="132" width="12" height="16"/>
    <rect x="616" y="120" width="12" height="16"/><rect x="644" y="120" width="12" height="16"/>
    <rect x="616" y="156" width="12" height="16"/><rect x="644" y="156" width="12" height="16"/>
  </g>

  <!-- roadway -->
  <rect x="0" y="300" width="800" height="260" fill="url(#road)"/>
  <rect x="0" y="296" width="800" height="10" fill="#6d757e"/>
  <!-- centreline, occluded where the trunk crosses it -->
  <g fill="#d8c65c">
    <rect x="40" y="424" width="70" height="9"/>
    <rect x="150" y="424" width="70" height="9"/>
    <rect x="600" y="424" width="70" height="9"/>
    <rect x="710" y="424" width="70" height="9"/>
  </g>

  <!-- kerb and sidewalk -->
  <rect x="0" y="286" width="800" height="12" fill="#98a2ac"/>

  <!-- root ball -->
  <g>
    <circle cx="112" cy="352" r="62" fill="#3c2b1f"/>
    <circle cx="112" cy="352" r="40" fill="#57402e"/>
    <g stroke="#2e2117" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M70 322 L34 292"/>
      <path d="M64 360 L20 358"/>
      <path d="M84 398 L58 434"/>
      <path d="M150 318 L182 288"/>
    </g>
  </g>

  <!-- trunk across both lanes -->
  <path d="M104 336 C 260 372, 470 398, 742 372 L 748 434 C 470 462, 250 434, 100 398 Z" fill="url(#bark)"/>
  <g stroke="#2f2118" stroke-width="3" opacity="0.55" fill="none">
    <path d="M120 352 C 280 388, 500 412, 744 388"/>
    <path d="M118 374 C 280 408, 500 430, 746 408"/>
  </g>

  <!-- major limb -->
  <path d="M430 392 C 470 344, 520 322, 592 316 L 600 344 C 536 352, 494 372, 462 404 Z" fill="#543c2b"/>

  <!-- foliage -->
  <g>
    <ellipse cx="612" cy="312" rx="96" ry="62" fill="#2f4a33"/>
    <ellipse cx="668" cy="336" rx="72" ry="48" fill="#3a5b3f"/>
    <ellipse cx="560" cy="330" rx="60" ry="40" fill="#274029"/>
    <ellipse cx="640" cy="290" rx="48" ry="32" fill="#436b48"/>
  </g>
  <g>
    <ellipse cx="300" cy="404" rx="44" ry="24" fill="#31502f" opacity="0.9"/>
    <ellipse cx="238" cy="418" rx="30" ry="16" fill="#3c5e39" opacity="0.85"/>
  </g>

  <!-- scattered debris -->
  <g fill="#4a3a2a" opacity="0.9">
    <rect x="352" y="472" width="46" height="7" rx="3" transform="rotate(-9 352 472)"/>
    <rect x="470" y="492" width="34" height="6" rx="3" transform="rotate(12 470 492)"/>
    <rect x="196" y="486" width="28" height="6" rx="3" transform="rotate(-16 196 486)"/>
  </g>

  <!-- overcast wash -->
  <rect width="800" height="560" fill="#0d1520" opacity="0.16"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">
    <rect x="18" y="516" width="152" height="28" rx="6" fill="#0b1017" opacity="0.72"/>
    <text x="30" y="535" fill="#c7d0da" letter-spacing="1.4">DEMO SCENE</text>
  </g>
</svg>
